name: Publish verified npm package

on:
  push:
    tags: ["ipfspawn@*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PACKAGE_INPUT: ipfspawn
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Select registered npm package
        id: target
        run: |
          target="$(pnpm exec publish-gate target --json)"
          printf '%s\n' "$target" | jq -r '"directory=\(.directory)\nchannel=\(.channel)"' >> "$GITHUB_OUTPUT"
          directory="$(printf '%s\n' "$target" | jq -r '.directory')"
          jq -e '.scripts.prepublishOnly == "publish-gate check"' "$directory/package.json" > /dev/null
      - name: Build package
        run: pnpm build
      - name: Publish through the installed lifecycle gate
        env:
          PACKAGE_DIRECTORY: ${{ steps.target.outputs.directory }}
          PNPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          PNPM_CONFIG_ACCESS: public
          PNPM_CONFIG_TAG: ${{ steps.target.outputs.channel }}
          PNPM_CONFIG_PROVENANCE: "true"
          PNPM_CONFIG_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: pnpm --dir "$PACKAGE_DIRECTORY" publish --no-git-checks
